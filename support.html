<h1>奶蛙对战 · 帮助和支持</h1>
<h2>怎么玩</h2>
<p>左边拖动走路；右边五个键：拳（连按三连击）、冲（撞飞对手）、挡（按住举盾）、吐（口水让对手变慢）、雷（召唤闪电）。把对手打下荷叶就赢。第一次点"开打"会有新手教学，选对手页也能"先练一下"。</p>
<h2>和朋友一起打</h2>
<p>面对面：大家都打开"和好友打"，一个人当房主，把附近的人"拉进来"，最多 4 人，人齐了点"开打"。远程：在"设置 → Game Center"登录后，点"邀请好友"。联机时大家要装同一个版本。</p>
